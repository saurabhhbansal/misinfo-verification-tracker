<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Misinformation Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="/">Misinfo<span>Tracker</span></a>
    <nav><a href="/">New check</a><a href="/history">History</a><a href="/docs">API</a></nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap foot">
  Academic prototype · PEC Chandigarh · Verdicts are automated and can be wrong — always open the evidence links.
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
